[package]
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "zkml"
description = "ZKML library"
readme.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "bench"
path = "src/bin/bench/cnn.rs"

[[bin]]
name = "bench-llm"
path = "src/bin/bench/llm.rs"

[[bin]]
name = "extract-logits"
path = "src/bin/extract_logits.rs"

[[bin]]
name = "verify-llm"
path = "src/bin/verify_llm.rs"

[features]
default = ["cpu"]
# Capture layers' quatization outputs for regression tests
capture-layers-quant = []
cpu = ["burn/ndarray", "dep:burn-ndarray"]
otel = ["dep:telemetry"]
# If `cuda` is also enabled it takes precedence over `wgpu`
wgpu = ["burn/wgpu", "gpu"]
# Linux only
cuda = ["burn/cuda", "gpu", "dp-crypto/cuda" ]
mem-track = ["utils/mem-track"]
# Internal. Use `wgpu` or `cuda` which will enable `gpu`
gpu = [
  "burn/fusion",
  "burn/autotune",
  "dep:burn-cubecl",
  "dep:burn-fusion",
  "dep:cubecl",
]


[dependencies]
ahash = "0.8.12"
anyhow.workspace = true
ark-std.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
ark-bn254.workspace = true
average = { version = "0.16.0", features = ["std"] }
bincode.workspace = true
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "c071730459a135b4d06ad0e14c8a0e5771e5ba58", default-features = false }
burn-cubecl = { git = "https://github.com/tracel-ai/burn.git", rev = "c071730459a135b4d06ad0e14c8a0e5771e5ba58", default-features = false, optional = true }
burn-fusion = { git = "https://github.com/tracel-ai/burn.git", rev = "c071730459a135b4d06ad0e14c8a0e5771e5ba58", default-features = false, optional = true }
burn-ndarray = { git = "https://github.com/tracel-ai/burn.git", rev = "c071730459a135b4d06ad0e14c8a0e5771e5ba58", optional = true, default-features = false, features = [
  "std",
  "multi-threads",
] }
candle-core = "0.9.1"
clap = { workspace = true, features = ["derive", "env"] }
crossbeam-channel = "0.5.15"
csv.workspace = true
cubecl = { git = "https://github.com/tracel-ai/cubecl.git", rev = "7cd8e9c869d363edcbf989fd905eb4b28df938ab", optional = true }
derive_more = { workspace = true, features = ["full"] }
dp-crypto.workspace = true
either = { workspace = true }
get-size2 = "0.6.2"
gguf-rs = "0.1.4"
git-version = "0.3.9"
half = "2.4.1"
itertools.workspace = true
lazy_static = "1.5.0"
libc = "0.2.180"
libm = "0.2.15"
ndarray = { version = "0.16.1" }
num_cpus = "1.17.0"
petgraph = "0.8.2"
postcard = { version = "1.1.3", features = ["use-std"] }
prost-tract-compat = { package = "prost", version = "0.11.9" }
rayon.workspace = true
rmp-serde.workspace = true
safetensors = "0.6.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
telemetry = { package = "telemetry", path = "../telemetry", optional = true }
tenstore = { path = "../tenstore" }
timed = { workspace = true }
timed-core = { workspace = true }
tokenizers = "0.22.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "fmt",
  "json",
] }
tract-onnx = { workspace = true }
ureq = { workspace = true }
utils = { path = "../utils" }
parking_lot = "0.12.5"

[target.'cfg(target_os = "macos")'.dependencies]
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "c071730459a135b4d06ad0e14c8a0e5771e5ba58", default-features = false, features = [
  "metal",
] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "c071730459a135b4d06ad0e14c8a0e5771e5ba58", default-features = false, features = [
  "vulkan",
] }

[dev-dependencies]
tempfile.workspace = true
blake3 = { version = "1", features = ["mmap"] }
criterion = { "version" = "0.6", features = ["html_reports"] }
divan = { version = "0.1.21" }
memmap2 = { workspace = true }
proptest = { version = "1.7.0" }
rand = { version = "0.9.2", features = ["std", "std_rng"] }
rstest = { version = "0.25.0" }
zstd = { version = "0.13.3" }
humansize = "2.1.3"
gguf-rs = "0.1.4"

[[bench]]
harness = false
name = "prove-model"

[[bench]]
harness = false
name = "layers"

[[bench]]
harness = false
name = "tensor"

[[bench]]
harness = false
name = "graph"

[[example]]
name = "chunk-cifar"
path = "examples/chunk_cifar.rs"

[[example]]
name = "chunk-llm"
path = "examples/chunk_llm.rs"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
